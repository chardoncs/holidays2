name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- --deny clippy::all
      - name: Tests
        run: cargo test

  changelog:
    name: changelog
    runs-on: ubuntu-latest

    steps:
      # git-cliff renders releases from the full history and tag set.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Guards cliff.toml: a broken config or template fails here instead of on
      # the release tag. The section is only rendered, not compared with the
      # committed CHANGELOG.md (which is regenerated with `just changelog`
      # right before tagging, so it trails the tag's own section).
      - name: Render unreleased changelog section
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
