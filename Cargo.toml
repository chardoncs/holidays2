[package]
name = "holidays2"
version = "0.1.0"
edition = "2024"
description = "Rust library to provide accurate and up-to-date holiday dates based on Python holidays package"
readme = "README.md"
repository = "https://github.com/chardoncs/holidays2.git"
license = "MIT"
keywords = ["holiday", "date", "time"]
categories = ["date-and-time"]

[dependencies]
chrono = "0.4"
once_cell = "1"
thiserror = "1"

[dev-dependencies]
anyhow = "1"
serial_test = "0.10"

[features]
default = ["country-all"]

